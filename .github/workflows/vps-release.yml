name: VPS release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ORAS_IMAGE: ghcr.io/oras-project/oras:v1.3.0@sha256:6ce045ce069a89934d6666b8b49f9c4c0145201bd6de6dbe2aee267814c55468

jobs:
  release:
    name: Publish immutable VPS artifacts
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build the canonical site tree
        run: |
          npm run docs:build
          ./scripts/build-site.sh "${RUNNER_TEMP}/site" "${GITHUB_SHA}"

      - name: Build deterministic VPS artifacts
        run: |
          ./scripts/build-vps-release.sh \
            "${RUNNER_TEMP}/site" \
            "${RUNNER_TEMP}/vps-release" \
            "${GITHUB_SHA}"

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the site and route inventory
        id: publish
        shell: bash
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/vps-release
        run: |
          set -Eeuo pipefail
          site_repository="ghcr.io/${GITHUB_REPOSITORY}/site"
          routes_repository="ghcr.io/${GITHUB_REPOSITORY}/routes"
          tag="sha-${GITHUB_SHA}"
          source="https://github.com/${GITHUB_REPOSITORY}"
          created_at=$(git show -s --format=%cI "${GITHUB_SHA}")

          publish() {
            local repository=$1
            local artifact_type=$2
            local file=$3
            local layer_type=$4
            docker run --rm \
              --volume "${HOME}/.docker:/root/.docker:ro" \
              --volume "${RELEASE_DIRECTORY}:/workspace:ro" \
              --workdir /workspace \
              "${ORAS_IMAGE}" push \
              --artifact-type "${artifact_type}" \
              --annotation "org.opencontainers.image.created=${created_at}" \
              --annotation "org.opencontainers.image.source=${source}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --format json \
              "${repository}:${tag}" \
              "${file}:${layer_type}"
          }

          site_result=$(publish \
            "${site_repository}" \
            application/vnd.vps-infra.static-site.v1 \
            site.tar.gz \
            application/vnd.vps-infra.static-site.v1+tar+gzip)
          routes_result=$(publish \
            "${routes_repository}" \
            application/vnd.vps-infra.route-inventory.v1 \
            routes.json \
            application/vnd.vps-infra.route-inventory.v1+json)

          site_digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${site_result}")
          routes_digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${routes_result}")
          {
            printf 'site_name=%s\n' "${site_repository}"
            printf 'site_digest=%s\n' "${site_digest}"
            printf 'routes_name=%s\n' "${routes_repository}"
            printf 'routes_digest=%s\n' "${routes_digest}"
          } >>"${GITHUB_OUTPUT}"

      - name: Attest the site artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.publish.outputs.site_name }}
          subject-digest: ${{ steps.publish.outputs.site_digest }}
          push-to-registry: true

      - name: Attest the route inventory
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.publish.outputs.routes_name }}
          subject-digest: ${{ steps.publish.outputs.routes_digest }}
          push-to-registry: true

      - name: Verify both GitHub attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUTES_DIGEST: ${{ steps.publish.outputs.routes_digest }}
          ROUTES_NAME: ${{ steps.publish.outputs.routes_name }}
          SITE_DIGEST: ${{ steps.publish.outputs.site_digest }}
          SITE_NAME: ${{ steps.publish.outputs.site_name }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "oci://${SITE_NAME}@${SITE_DIGEST}" --repo "${GITHUB_REPOSITORY}"
          gh attestation verify "oci://${ROUTES_NAME}@${ROUTES_DIGEST}" --repo "${GITHUB_REPOSITORY}"

      - name: Record immutable release evidence
        id: evidence
        shell: bash
        env:
          ROUTES_DIGEST: ${{ steps.publish.outputs.routes_digest }}
          ROUTES_NAME: ${{ steps.publish.outputs.routes_name }}
          SITE_DIGEST: ${{ steps.publish.outputs.site_digest }}
          SITE_NAME: ${{ steps.publish.outputs.site_name }}
        run: |
          evidence_directory="${RUNNER_TEMP}/vps-release"
          temporary_evidence="${evidence_directory}/evidence.json"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg revision "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg site "${SITE_NAME}@${SITE_DIGEST}" \
            --arg routes "${ROUTES_NAME}@${ROUTES_DIGEST}" \
            '{
              schema: 1,
              workflow_path: ".github/workflows/vps-release.yml",
              repository: $repository,
              source_revision: $revision,
              run_id: $run_id,
              run_attempt: $run_attempt,
              conclusion: "success",
              site: $site,
              routes: $routes
            }' >"${temporary_evidence}"
          evidence_hash=$(sha256sum "${temporary_evidence}" | awk '{print $1}')
          evidence_file="${evidence_directory}/vps-release-evidence-v1-${evidence_hash}.json"
          mv "${temporary_evidence}" "${evidence_file}"
          {
            printf 'path=%s\n' "${evidence_file}"
            printf 'sha256=%s\n' "${evidence_hash}"
          } >>"${GITHUB_OUTPUT}"
          {
            echo '### VPS release'
            echo
            echo "Site: \`${SITE_NAME}@${SITE_DIGEST}\`"
            echo
            echo "Routes: \`${ROUTES_NAME}@${ROUTES_DIGEST}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload promotion evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.evidence.outputs.path }}
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Verify raw promotion evidence metadata
        shell: bash
        env:
          ACTUAL_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ steps.evidence.outputs.sha256 }}
        run: |
          set -Eeuo pipefail
          test "${ACTUAL_DIGEST}" = "${EXPECTED_DIGEST}"
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          {
            echo
            echo "Raw evidence artifact ID: \`${ARTIFACT_ID}\`"
            echo
            echo "Raw evidence SHA-256: \`${ACTUAL_DIGEST}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
