name: Deploy Site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # docs:build invoque le wrapper retype.js via node directement :
      # npm 10.9.x (node 22) ne crée pas le lien node_modules/.bin/retype
      # à l'installation (collision de noms de bin avec les paquets
      # plateforme retypeapp-*), donc la commande nue `retype` échouerait.
      - run: npm run docs:build
      - name: Prepare deployment directory
        run: |
          mkdir -p site/docs
          cp index.html site/index.html
          cp favicon.svg site/favicon.svg
          cp robots.txt site/robots.txt
          cp 404.html site/404.html
          cp site.webmanifest site/site.webmanifest
          cp sitemap.xml site/sitemap.xml
          cp -R assets site/assets
          cp -R dashboard site/dashboard
          cp -R docs-site/. site/docs/
      - name: Build per-language pages + cache-busting
        run: node scripts/build-lang-pages.mjs site "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Ne déploie que depuis master : les branches de debug/PR construisent
    # sans toucher au site en production.
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
