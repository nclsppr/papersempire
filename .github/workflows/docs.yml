name: Deploy Site

on:
  push:
    branches:
      - master
      - fix/docs-retype
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Le lockfile commité était désynchronisé (retypeapp 3.11.0 vs ^4.6.0) ;
      # on le régénère ici une fois pour l'exporter en artefact et le
      # committer, puis ce step redeviendra un simple `npm ci`.
      - name: Install dependencies (regenerate lockfile)
        run: |
          rm -f package-lock.json
          npm install
      - name: Upload regenerated lockfile as artifact
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
      # docs:build invoque le wrapper retype.js via node directement :
      # npm 10.9.x (node 22) a un bug où le lien node_modules/.bin/retype
      # n'est pas créé à l'installation.
      - run: npm run docs:build
      - name: Prepare deployment directory
        run: |
          mkdir -p site/docs
          cp index.html site/index.html
          cp favicon.svg site/favicon.svg
          cp robots.txt site/robots.txt
          cp sitemap.xml site/sitemap.xml
          cp -R assets site/assets
          cp -R docs-site/. site/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Ne déploie que depuis master : les branches de debug/PR construisent
    # sans toucher au site en production.
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
