name: Deploy Site

on:
  push:
    branches:
      - master
      - fix/docs-retype
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "DEBUG: versions"
        run: |
          echo "node: $(node --version)  npm: $(npm --version)"
      - name: "DEBUG: fresh install then probe bin candidates"
        run: |
          rm -rf node_modules package-lock.json
          npm install
          echo "===== A. .bin after fresh install ====="
          ls -la node_modules/.bin/ 2>/dev/null || echo "(no .bin dir)"
          echo "===== B. npm rebuild retypeapp, then .bin ====="
          npm rebuild retypeapp || true
          ls -la node_modules/.bin/ 2>/dev/null | grep -i retype || echo "(still no retype link)"
          echo "===== C. direct node invocation ====="
          node node_modules/retypeapp/retype.js --version || echo "(direct invocation failed)"
          echo "===== D. npm exec resolution ====="
          npm exec --no -- retype --version || echo "(npm exec failed)"
      - name: Build docs (direct node invocation, immune to .bin linking)
        run: node node_modules/retypeapp/retype.js build docs --output docs-site
      - name: Upload regenerated lockfile as artifact
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
      - name: Prepare deployment directory
        run: |
          mkdir -p site/docs
          cp index.html site/index.html
          cp favicon.svg site/favicon.svg
          cp robots.txt site/robots.txt
          cp sitemap.xml site/sitemap.xml
          cp -R assets site/assets
          cp -R docs-site/. site/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Ne déploie que depuis master : les branches de debug/PR construisent
    # sans toucher au site en production.
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
