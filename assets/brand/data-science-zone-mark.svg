<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Data Science Zone</title>
  <desc id="desc">Une couronne de papier alimente un analyseur de production Papers Empire.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#315c72"/>
      <stop offset=".48" stop-color="#19384e"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="roller" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1eadb"/>
      <stop offset=".28" stop-color="#87939a"/>
      <stop offset=".62" stop-color="#354854"/>
      <stop offset="1" stop-color="#101d27"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#d9cfb8"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c764"/>
      <stop offset="1" stop-color="#9d6a20"/>
    </linearGradient>
    <linearGradient id="goldPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe09a"/>
      <stop offset=".48" stop-color="#d9a84d"/>
      <stop offset="1" stop-color="#9d6a20"/>
    </linearGradient>
  </defs>

  <!-- Plaque d'instrumentation compacte, dessinée pour rester lisible à 32 px. -->
  <path d="M38 66h28l11-15h102l11 15h28l19 19v126l-19 19H38l-19-19V85Z"
        fill="#06101a" stroke="#06101a" stroke-width="12" stroke-linejoin="round" transform="translate(3 4)"/>
  <path d="M38 66h28l11-15h102l11 15h28l19 19v126l-19 19H38l-19-19V85Z"
        fill="url(#steel)" stroke="#d9a84d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M42 74h31l10-14h90l10 14h31l14 14v119l-14 14H42l-14-14V88Z"
        fill="none" stroke="#07131f" stroke-width="5" stroke-linejoin="round"/>

  <!-- Couronne canonique en trois feuilles pliées. -->
  <g stroke="#33261a" stroke-width="5" stroke-linejoin="round">
    <path d="m57 70 34-36 25 31-12 51-37-9Z" fill="url(#brass)"/>
    <path d="m91 41 37-29 37 29-14 77h-46Z" fill="url(#goldPaper)"/>
    <path d="m140 65 25-31 34 36-10 37-37 9Z" fill="url(#brass)"/>
    <path d="m91 34 3 23 22 8Z" fill="#fff0c7"/>
    <path d="m128 12 14 27 23 2Z" fill="#fff0c7"/>
    <path d="m165 34-3 23-22 8Z" fill="#fff0c7"/>
  </g>

  <!-- Deux rouleaux et une feuille relient explicitement imprimerie et données. -->
  <g stroke="#07131f" stroke-width="4">
    <rect x="55" y="105" width="146" height="26" rx="13" fill="url(#roller)"/>
    <circle cx="60" cy="118" r="9" fill="#19384e" stroke="#d9a84d" stroke-width="3"/>
    <circle cx="196" cy="118" r="9" fill="#19384e" stroke="#d9a84d" stroke-width="3"/>
    <rect x="55" y="132" width="146" height="23" rx="11.5" fill="url(#roller)"/>
    <circle cx="60" cy="143.5" r="8" fill="#19384e"/>
    <circle cx="196" cy="143.5" r="8" fill="#19384e"/>
  </g>
  <path d="M91 146h74v35H91Z" fill="url(#paper)" stroke="#33261a" stroke-width="4" stroke-linejoin="round"/>

  <!-- Écran analytique : une seule courbe, pas un pictogramme de dashboard générique. -->
  <rect x="46" y="168" width="164" height="45" rx="9" fill="#07131f" stroke="#d9a84d" stroke-width="4"/>
  <path d="M59 201h138" fill="none" stroke="#315c72" stroke-width="2" opacity=".78"/>
  <path d="M59 200c17-1 24-13 38-13 15 0 20 9 34 7 14-2 20-16 35-16 11 0 17 8 31 4"
        fill="none" stroke="#74c6d6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f8f0dc" stroke="#07131f" stroke-width="2">
    <circle cx="59" cy="200" r="4.5"/>
    <circle cx="131" cy="194" r="4.5"/>
    <circle cx="197" cy="182" r="4.5"/>
  </g>
  <circle cx="128" cy="224" r="11" fill="#e55a18" stroke="#07131f" stroke-width="5"/>
  <circle cx="128" cy="224" r="5" fill="#ffd071"/>
</svg>
